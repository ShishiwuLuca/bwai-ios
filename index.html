<!doctype html>
<html lang="en" id="htmlRoot">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <meta name="renderer" content="webkit" />
  <meta name="force-rendering" content="webkit" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico?v=<%= assetVersion %>" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta http-equiv="pragma" content="no-cache" />
  <meta http-equiv="cache-control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Cache" content="no-cache" />
  <meta http-equiv="expires" content="-1" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="wap-font-scale" content="no" />
  <meta name="keywords" content="BWAI" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="app-mobile-web-app-capable" content="yes" />
  <meta name="screen-orientation" content="portrait" />
  <meta name="x5-orientation" content="portrait" />
  <link rel="manifest" href="/manifest.json?v=<%= assetVersion %>" />
  <link rel="apple-touch-icon" href="/icons/Icon-192.png?v=<%= assetVersion %>" />
  <title>
    <%= title %>
  </title>
  <style id="cap-ios-paint-fix">
    html.cap-native,
    html.cap-native body,
    html.cap-native #app,
    html.cap-native .van-config-provider {
      min-height: var(--app-height, 100vh);
      height: var(--app-height, 100vh);
    }
  </style>
  <style id="page-shell-splash-style">
    #page-shell-splash {
      position: fixed;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 22vh;
      pointer-events: none;
      z-index: 24001;
    }

    #page-shell-splash img {
      width: 2.8rem;
      max-width: 46vw;
      height: auto;
      object-fit: contain;
    }
  </style>
  <script>
    (function () {
      var p = location.protocol || '';
      if (p !== 'capacitor:' && p !== 'ionic:') return;
      document.documentElement.classList.add('cap-native');
      function setAppHeight() {
        var h = Math.max(window.innerHeight || 0, 1);
        var px = h + 'px';
        document.documentElement.style.setProperty('--app-height', px);
        document.documentElement.style.height = px;
        if (document.body) document.body.style.height = px;
      }
      setAppHeight();
      window.addEventListener('resize', setAppHeight, { passive: true });
      window.addEventListener('orientationchange', setAppHeight, { passive: true });
    })();
  </script>
  <script>
    (function () {
      var shellSplashPaths = ['/Login', '/Register', '/ForgotPassword'];
      var path = (location.pathname || '').replace(/\/$/, '') || '/';

      function applyShellSplash() {
        if (document.getElementById('page-shell-splash')) return;
        var splash = document.createElement('div');
        splash.id = 'page-shell-splash';
        var img = document.createElement('img');
        img.src = '/images/logo_bitgo.png';
        img.alt = '';
        splash.appendChild(img);
        document.body.appendChild(splash);
      }

      function initShellFirstPaint() {
        if (shellSplashPaths.indexOf(path) !== -1) applyShellSplash();
      }

      if (document.body) initShellFirstPaint();
      else document.addEventListener('DOMContentLoaded', initShellFirstPaint);
    })();
  </script>
  <script>
    !(function (window) {
      var docWidth = 750,
        doc = window.document,
        docEl = doc.documentElement,
        resizeEvt = 'orientationchange' in window ? 'orientationchange' : 'resize';
      var recalc = (function refreshRem() {
        var clientWidth = docEl.getBoundingClientRect().width;
        docEl.style.fontSize =
          Math.max(Math.min(20 * (clientWidth / docWidth), 11.2), 8.55) * 5 + 'px';
        return refreshRem;
      })();
      if (!doc.addEventListener) return;
      window.addEventListener(resizeEvt, recalc, false);
      doc.addEventListener('DOMContentLoaded', recalc, false);
      window.addEventListener('load', recalc, false);
      setTimeout(recalc, 100);
      setTimeout(recalc, 500);
    })(window);

    (function () {
      try {
        if (
          typeof Proxy === 'undefined' ||
          typeof Promise === 'undefined' ||
          typeof Object.assign === 'undefined'
        ) {
          window.location.href = '/Browser.html';
        }
      } catch (e) {
        window.location.href = '/Browser.html';
      }
    })();

    window.addEventListener('beforeinstallprompt', function (e) {
      window.pwaDeferredPrompt = e;
    });

    // UnRegister Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((registrations) => {
        for (let registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
</head>

<body ontouchstart="" style="background: var(--van-background)" translate="no">
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
